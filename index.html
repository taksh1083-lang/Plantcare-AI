<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>PlantCare AI</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:auto;padding:16px;line-height:1.5}
#box{padding:12px;border-radius:8px;margin:12px 0;border:2px solid}.healthy{background:#e6f6e6;border-color:#2a7}
.sick{background:#fff3d6;border-color:#d90}.unsure{background:#e8f0ff;border-color:#46c}.bad{background:#fde8e8;border-color:#c33}
img{max-width:100%;border-radius:8px}small{color:#555}</style></head><body>
<h1>🌿 PlantCare AI</h1><p>Upload a photo of one plant leaf for a preliminary health check.</p>
<input type="file" id="f" accept="image/*"><p id="st"><small>Loading models (first visit ~100 MB)…</small></p>
<img id="im" hidden><div id="box" hidden></div>
<small>Preliminary, image-based prediction, not a guaranteed diagnosis. It may require confirmation by a plant pathologist or local agricultural extension service.</small>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script type="module">
import {pipeline} from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';
const T={blur:60,dark:40,bright:225,plant:.5,leaf:.45,minc:.6,healthy:.8,margin:.3};
const LEAF=["a close-up photo of a plant leaf","a photo of a single green leaf with veins"],
 PLANT=["a photo of a whole plant","a photo of fruit or vegetables on a plant"],
 NOT=["a photo of a person","a photo of an animal","a photo of a building","a photo of food on a plate",
 "a screenshot or document with text","a photo of green cloth or plastic","a photo of a room"];
const $=id=>document.getElementById(id), slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
let clip,sess,meta,info={};
function show(cls,title,lines){const b=$('box');b.hidden=false;b.className=cls;
 b.innerHTML='<b>'+title+'</b>'+lines.map(l=>'<p>'+l+'</p>').join('');}
function parse(raw){const [sp,c='unknown']=raw.split('___');return{species:sp.replace(/_/g,' ').trim(),
 cond:c.replace(/_/g,' ').trim(),key:slug(c.replace(/\(.*?\)/g,'')),healthy:slug(c)==='healthy'}}
function quality(img){const s=512/Math.max(img.width,img.height),w=Math.max(3,Math.round(img.width*s)),h=Math.max(3,Math.round(img.height*s));
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
 const d=x.getImageData(0,0,w,h).data,g=new Float32Array(w*h);let m=0;
 for(let i=0;i<w*h;i++){g[i]=.299*d[4*i]+.587*d[4*i+1]+.114*d[4*i+2];m+=g[i]}m/=w*h;
 let n=0,a=0,q=0;for(let y=1;y<h-1;y++)for(let i=1;i<w-1;i++){const k=y*w+i,l=-4*g[k]+g[k-1]+g[k+1]+g[k-w]+g[k+w];n++;a+=l;q+=l*l}
 const v=q/n-(a/n)**2,issues=[];if(Math.min(img.width,img.height)<224)issues.push("The image resolution is too low.");
 if(v<T.blur)issues.push("The image is blurry.");if(m<T.dark)issues.push("The image is too dark or poorly lit.");
 if(m>T.bright)issues.push("The image is overexposed (too bright).");return issues}
function tensor(img){const s=256/Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=224;
 const x=c.getContext('2d');x.drawImage(img,(224-img.width*s)/2,(224-img.height*s)/2,img.width*s,img.height*s);
 const d=x.getImageData(0,0,224,224).data,t=new Float32Array(3*224*224),M=[.485,.456,.406],S=[.229,.224,.225];
 for(let i=0;i<224*224;i++)for(let k=0;k<3;k++)t[k*224*224+i]=(d[4*i+k]/255-M[k])/S[k];
 return new ort.Tensor('float32',t,[1,3,224,224])}
async function analyze(file){
 const url=URL.createObjectURL(file);$('im').src=url;$('im').hidden=false;
 const img=new Image();img.src=url;await img.decode();
 const qi=quality(img);
 if(qi.length)return show('bad','Image quality too low for analysis',[...qi,"Please take a clearer photograph: hold steady, use natural daylight and fill the frame with one leaf."]);
 const labels=[...LEAF,...PLANT,...NOT],r=await clip(url,labels),sc=l=>r.filter(o=>l.includes(o.label)).reduce((a,o)=>a+o.score,0);
 const leaf=sc(LEAF),plant=leaf+sc(PLANT);
 if(plant<T.plant)return show('bad','Not a plant or leaf',["No recognizable plant or leaf detected. Please upload a clear image of a plant or leaf."]);
 if(leaf<T.leaf)return show('bad','Leaf not clearly visible',["A plant may be present, but no leaf is clearly visible, so this image is unsuitable for reliable leaf analysis. Please upload a close, well-lit photo of a single leaf."]);
 const o=(await sess.run({x:tensor(img)})).logits.data,z=Array.from(o,v=>v/meta.temperature),mx=Math.max(...z),e=z.map(v=>Math.exp(v-mx)),sum=e.reduce((a,b)=>a+b),
  p=e.map(v=>v/sum),idx=p.map((v,i)=>i).sort((a,b)=>p[b]-p[a]),top=idx[0],sec=idx[1],lab=parse(meta.classes[top]),pc=Math.round(p[top]*100);
 if(p[top]<T.minc)return show('unsure','Unable to determine',["Unable to determine. The plant, the condition or the photo may be outside what this model was trained on, so no diagnosis is offered."]);
 if(p[top]-p[sec]<T.margin)return show('unsure','Inconclusive result',["The model cannot reliably distinguish between several possibilities, so no diagnosis is given.","Closest candidates (reference only): "+idx.slice(0,3).map(i=>meta.classes[i].replace(/___/g,' - ').replace(/_/g,' ')+' '+Math.round(p[i]*100)+'%').join('; ')]);
 if(lab.healthy){if(p[top]<T.healthy)return show('unsure','Inconclusive result',["The model leans towards 'healthy' but is not confident enough to say so."]);
  return show('healthy','Appears healthy',["No obvious signs of disease detected. The plant appears healthy based on the image.","Species: "+lab.species+" · confidence "+pc+"%","A single photo cannot rule out early disease, pests or nutrient problems. Keep monitoring."])}
 const d=info[lab.key];show('sick','Possible disease detected',["Most likely: "+lab.cond+" on "+lab.species+" · confidence "+pc+"%",
  ...(d?["<i>Typical symptoms:</i> "+d.symptoms,"<i>Next steps:</i> "+d.management.join(' ')]:[]),
  "Confirm on several leaves before acting. Avoid pesticides or fungicides until confirmed by an expert."])}
try{meta=await (await fetch('classes.json')).json();
 try{info=await (await fetch('disease_info.json')).json()}catch(e){}
 ort.env.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
 sess=await ort.InferenceSession.create('plant_classifier.onnx');
 clip=await pipeline('zero-shot-image-classification','Xenova/clip-vit-base-patch32');
 $('st').innerHTML='<small>Ready.'+(meta.accuracy?' Model test accuracy '+Math.round(meta.accuracy*100)+'% (optimistic on real field photos).':'')+'</small>';
 $('f').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('st').textContent='Analysing…';
  try{await analyze(f);$('st').textContent=''}catch(err){show('bad','Analysis could not be completed',[String(err)])}}
}catch(err){$('st').textContent='Could not load models: '+err}
</script></body></html>
